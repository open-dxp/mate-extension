name: CI

on:
    workflow_dispatch:
    schedule:
        -   cron: '0 5 * * *'
    push:
        branches:
            - "[0-9]+.[0-9]+"
            - "[0-9]+.x"
    pull_request:
        types: [ opened, synchronize, reopened ]

jobs:
    ci:
        uses: open-dxp/workflows-collection-public/.github/workflows/reusable-ci.yaml@main
        secrets: inherit
